[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding-lab"
version = "0.1.0"
description = "Local speculative-decoding experiment harness"
requires-python = ">=3.10"
authors = [{name = "Aarnav Saboo"}]

[project.scripts]
speculative-decoding-lab = "speculative_decoding_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["speculative_decoding_lab*"]
