[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding-lab"
version = "0.1.0"
description = "Experiment harness for baseline-paired speculative decoding measurements."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Aarnav Saboo"}]
keywords = ["llm", "speculative-decoding", "llama-cpp", "inference", "benchmarking"]

[project.scripts]
speculative-decoding-lab = "speculative_decoding_lab.__main__:main"

[project.urls]
Repository = "https://github.com/aarnavsaboo/speculative-decoding-lab"

[tool.setuptools.packages.find]
include = ["speculative_decoding_lab*"]
